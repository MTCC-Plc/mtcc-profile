name: Deploy MTCC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cancel_deployment:
        description: 'Optional: stuck Pages deployment SHA to cancel before deploying'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static website
        run: corepack pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # GitHub Pages has no Worker, so the enquiry dialog opens an email draft.
          NEXT_PUBLIC_ENQUIRY_ENDPOINT: mailto
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recover a stuck Pages deployment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cancel_deployment != '' }}
        uses: actions/github-script@v8
        env:
          STUCK_DEPLOYMENT: ${{ inputs.cancel_deployment }}
        with:
          script: |
            const id = process.env.STUCK_DEPLOYMENT.trim();
            if (!/^[a-f0-9]{40}$/i.test(id)) {
              throw new Error('Enter the full 40-character deployment SHA from the error.');
            }
            const params = { ...context.repo, pages_deployment_id: id };
            const terminal = new Set(['succeed', 'cancelled', 'canceled', 'deployment_cancelled',
              'deployment_failed', 'deployment_content_failed', 'deployment_attempt_error',
              'deployment_lost', 'failed']);
            const status = async () => {
              try {
                const response = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', params);
                return response.data.status;
              } catch (error) {
                if (error.status === 404) return 'not_found';
                throw error;
              }
            };
            const initial = await status();
            if (terminal.has(initial) || initial === 'not_found') {
              core.info(`Previous deployment is ${initial}; continuing.`);
              return;
            }
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', params);
            } catch (error) {
              if (![400, 404, 409].includes(error.status)) throw error;
              const current = await status();
              if (!terminal.has(current) && current !== 'not_found') throw error;
              return;
            }
            for (let attempt = 0; attempt < 24; attempt++) {
              const current = await status();
              core.info(`Previous deployment: ${current}`);
              if (terminal.has(current) || current === 'not_found') return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('GitHub has not released the previous deployment yet. Wait a few minutes and run recovery again.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
